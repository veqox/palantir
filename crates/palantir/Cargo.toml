[package]
name = "palantir"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }

[[bin]]
name = "palantir"
path = "src/main.rs"

[dependencies]
ebpf-common = { workspace = true, features = ["std"] }

aya = { workspace = true }
aya-log = { workspace = true }

axum = { workspace = true, features = ["http1", "http2", "tokio", "tracing", "json"]}
async-stream = { workspace = true }
futures-util = { workspace = true }

libc = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time"] }
log = { workspace = true }
env_logger = { workspace = true }
maxminddb = { workspace = true, features = ["mmap"] }
serde = { workspace = true }
serde_json = { workspace = true }


[build-dependencies]
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
